name: sentinel-portfolio
services:
  mysql:
    image: ${PORTFOLIO_MYSQL_IMAGE:?locked image required}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sentinel_portfolio
      MYSQL_USER: sentinel_local
      MYSQL_PASSWORD_FILE: /run/secrets/mysql-app
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root
      TZ: UTC
    secrets: [mysql-app, mysql-root]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/cdc/mysql-cdc.cnf:/etc/mysql/conf.d/portfolio-cdc.cnf:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 40
  redis:
    image: ${PORTFOLIO_REDIS_IMAGE:?locked image required}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["redis-data:/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  status-cache-redis:
    profiles: [status-cache]
    image: ${PORTFOLIO_REDIS_IMAGE:?locked image required}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:16380:6379"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
  kafka-volume-init:
    image: ${PORTFOLIO_KAFKA_IMAGE:?locked image required}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /data"]
    volumes: ["kafka-data:/data"]
    network_mode: none
    mem_limit: 64m
  kafka:
    image: ${PORTFOLIO_KAFKA_IMAGE:?locked image required}
    restart: unless-stopped
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:19092:9094"]
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
  mock-ai:
    image: sentinel-portfolio-mock-ai:e02
    restart: unless-stopped
    build:
      context: ./infra/mock-ai
      args:
        PYTHON_IMAGE: ${PORTFOLIO_PYTHON_IMAGE:?locked image required}
    ports: ["127.0.0.1:18081:8080"]
    volumes: ["${PORTFOLIO_JOURNAL_DIR:?local journal directory required}:/data"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  connect:
    profiles: [cdc]
    image: ${PORTFOLIO_CONNECT_IMAGE:?locked CDC image required}
    restart: unless-stopped
    group_add: ["${PORTFOLIO_SECRET_GID:?secret reader group required}"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports: ["127.0.0.1:18083:8083"]
    secrets:
      - source: cdc-reader
        target: cdc-reader.properties
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: sentinel-connect
      CONFIG_STORAGE_TOPIC: sentinel-connect-configs
      OFFSET_STORAGE_TOPIC: sentinel-connect-offsets
      STATUS_STORAGE_TOPIC: sentinel-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_PARTITIONS: "1"
      CONNECT_STATUS_STORAGE_PARTITIONS: "1"
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      CONNECT_CONFIG_PROVIDERS_FILE_PARAM_ALLOWED_PATHS: /run/secrets/cdc-reader.properties
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      OFFSET_FLUSH_INTERVAL_MS: "1000"
      ADVERTISED_HOST_NAME: connect
      HEAP_OPTS: -Xms128m -Xmx512m
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 5s
      timeout: 3s
      retries: 30
secrets:
  mysql-app:
    file: ${PORTFOLIO_SECRET_DIR:?local secret directory required}/mysql-app
  mysql-root:
    file: ${PORTFOLIO_SECRET_DIR:?local secret directory required}/mysql-root
  cdc-reader:
    file: ${PORTFOLIO_SECRET_DIR:?local secret directory required}/cdc-reader.properties
volumes:
  mysql-data:
  redis-data:
  kafka-data:
networks:
  default:
    driver: bridge
