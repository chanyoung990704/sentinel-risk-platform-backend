plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aivle'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	mockitoAgent
}

repositories {
	mavenCentral()
}

dependencies {
	// Boot 3.5 계열과 호환되는 모듈 경계 검증만 도입한다. 영속 이벤트 경로는 기존 CDC를 유지한다.
	implementation platform('org.springframework.modulith:spring-modulith-bom:1.4.14')
	implementation 'org.springframework.modulith:spring-modulith-api'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	// Web & Security & JPA
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.batch:spring-batch-core'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
	implementation 'io.github.resilience4j:resilience4j-reactor:2.2.0'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Email
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// Thymeleaf
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// MapStruct (Lombok 호환성 설정 포함)
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	// Lombok과 MapStruct의 순서 충돌 방지를 위한 바인딩 라이브러리
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"

	// DB Utilities
	// P6Spy: 버전 명시 필요 (Boot 3 호환)
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Excel (Apache POI)
	implementation 'org.apache.poi:poi-ooxml:5.4.0'
	// 모의 보고서도 크기/구조가 유효한 PDF인지 검사한다.
	implementation('org.apache.pdfbox:pdfbox:3.0.8') { exclude group: 'commons-logging', module: 'commons-logging' }

	// API Documentation (Swagger)
	// SpringDoc: 버전 명시 필요 (Boot 3.x 대응)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.15'

	// AWS SDK (S3)
	implementation platform('software.amazon.awssdk:bom:2.25.57')
	implementation 'software.amazon.awssdk:s3'

	// Annotation Processor
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	mockitoAgent('org.mockito:mockito-core') {
		transitive = false
	}
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 모든 시험 task가 기존 보안 프로필과 Mockito agent를 공유한다.
tasks.withType(Test).configureEach {
	jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
	systemProperty "spring.profiles.active", "test"
}

tasks.named('test') {
	def excludeTagsProp = (project.findProperty("excludeTags") ?: System.getenv("JUNIT_EXCLUDE_TAGS"))?.toString()?.trim()
	def excludeIntegrationByName = (project.findProperty("excludeIntegrationByName") ?: System.getenv("JUNIT_EXCLUDE_INTEGRATION_BY_NAME"))?.toString()?.toBoolean()
	if (excludeTagsProp) {
		def excludeTagList = excludeTagsProp.split(',')*.trim().findAll { !it.isEmpty() }
		useJUnitPlatform {
			excludeTags excludeTagList as String[]
		}
	} else {
		useJUnitPlatform()
	}
	if (excludeIntegrationByName) {
		// CI 속도 개선용: 명시적으로 IntegrationTest 네이밍을 제외
		exclude '**/*IntegrationTest.class'
	}
}

// 결과를 매번 새로 생성해 이전 실행의 XML을 검증 근거로 쓰지 않는다.
def portfolioTest = { String taskName, List<String> included, List<String> excluded ->
	tasks.register(taskName, Test) {
		group = 'verification'
		description = "Run ${taskName} portfolio test scope"
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		dependsOn tasks.named('testClasses')
		maxParallelForks = 1
		forkEvery = 0
		maxHeapSize = '512m'
		// 많은 JPA 시험 컨텍스트가 512MB heap을 채우지 않도록 보관 수를 제한한다.
		systemProperty 'spring.test.context.cache.maxSize', '16'
		// 별도 JVM의 강제 종료·재개 시험에서도 동일한 시험/애플리케이션 클래스를 사용한다.
		systemProperty 'sentinel.test.classpath', sourceSets.test.runtimeClasspath.asPath
		outputs.upToDateWhen { false }
		useJUnitPlatform {
			if (included) includeTags included as String[]
			if (excluded) excludeTags excluded as String[]
		}
	}
}

portfolioTest('fastTest', [], ['integration', 'realinfra', 'cdc', 'reliability', 'modulith']).configure {
	systemProperty 'spring.kafka.listener.auto-startup', 'false'
	systemProperty 'spring.kafka.admin.auto-create', 'false'
}
portfolioTest('realInfraTest', ['integration', 'realinfra'], ['cdc', 'reliability']).configure {
	// 보관한 각 컨텍스트가 pool10을 유지하므로 MySQL 연결 한도를 넘지 않도록 제한한다.
	systemProperty 'spring.test.context.cache.maxSize', '8'
}
portfolioTest('cdcTest', ['cdc'], [])
portfolioTest('reliabilityTest', ['reliability'], [])
portfolioTest('modulithTest', ['modulith'], [])

// DB/서버 기동 없이 지정한 원본 파일만 검증한다. 오류 격리는 종료 코드 2다.
tasks.register('prepareCustomReportCli') {
	group = 'verification'
	description = 'Prepare the standalone local report recovery command'
	dependsOn tasks.named('classes')
	def destination = layout.buildDirectory.file('portfolio-report-classpath.txt')
	inputs.files(sourceSets.main.runtimeClasspath)
	outputs.file(destination)
	doLast { destination.get().asFile.text = sourceSets.main.runtimeClasspath.asPath }
}
tasks.named('realInfraTest') { dependsOn tasks.named('prepareCustomReportCli') }
tasks.named('reliabilityTest') { dependsOn tasks.named('prepareCustomReportCli') }

tasks.register('prepareImportCli') {
	group = 'verification'
	description = 'Prepare the standalone local data import command'
	dependsOn tasks.named('classes')
	def destination = layout.buildDirectory.file('portfolio-import-classpath.txt')
	outputs.file(destination)
	doLast {
		destination.get().asFile.text = sourceSets.main.runtimeClasspath.asPath
	}
}

tasks.register('importPreflight', JavaExec) {
	group = 'verification'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.aivle.project.finance.internal.dataimport.cli.ImportPreflightCommand'
	maxHeapSize = '1g'
	doFirst {
		if (!project.hasProperty('sourceDir') || !project.hasProperty('outputDir')) {
			throw new GradleException('-PsourceDir=<원본 경로> -PoutputDir=<새 결과 경로> 필요')
		}
		args project.property('sourceDir'), project.property('outputDir'), project.findProperty('baseQuarter') ?: '20253'
	}
}

def outboxMode = providers.gradleProperty('outboxMode').getOrElse('undecided')
def requiredPortfolioTests = ['modulithTest', 'fastTest', 'realInfraTest', 'reliabilityTest']
if (outboxMode == 'cdc') requiredPortfolioTests += 'cdcTest'
def verificationStartedAt = System.currentTimeMillis() / 1000.0

tasks.register('verifiedCheck', Exec) {
	group = 'verification'
	description = 'Require executed, passing, unskipped portfolio scopes (Python 3 required)'
	dependsOn requiredPortfolioTests
	doFirst {
		if (!(outboxMode in ['cdc', 'polling'])) {
			throw new GradleException('Choose -PoutboxMode=cdc or polling after validating connector readiness')
		}
	}
	commandLine(['python3', 'scripts/reliability/verify_test_results.py',
		'--results-root', 'build/test-results', '--deny-skips', '--since', verificationStartedAt.toString(),
		'--output', 'build/reports/portfolio-verification.json'] +
		requiredPortfolioTests.collectMany { ['--require', it] })
}
